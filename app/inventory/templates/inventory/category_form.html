<form action="{{ url_for('inventory.edit_category', company_id=company_id, category_id=category.id) if category else url_for('inventory.create_category', company_id=company_id) }}" 
      method="POST" 
      class="flex flex-col h-full bg-white">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  
  <div class="flex-1 overflow-y-auto p-6 space-y-6">
    <div>
      <label for="name" class="block text-sm font-semibold text-slate-700 mb-1.5">Nombre <span class="text-rose-500">*</span></label>
      <input type="text" name="name" id="name" required
        value="{{ form_data.name if form_data else (category.name if category else '') }}"
        class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm"
        placeholder="Ej. Electrónica">
    </div>

    <div>
      <label for="description" class="block text-sm font-semibold text-slate-700 mb-1.5">Descripción</label>
      <textarea name="description" id="description" rows="3"
        class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm resize-none"
        placeholder="Opcional...">{{ form_data.description if form_data else (category.description if category else '') }}</textarea>
    </div>
  </div>

  <div class="p-6 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-3 flex-shrink-0">
    <button type="button" data-action="close-drawer"
      class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 transition-colors shadow-sm bg-white">
      Cancelar
    </button>
    <button type="submit"
      class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 transition-colors shadow-sm">
      {{ 'Guardar Cambios' if category else 'Crear Categoría' }}
    </button>
  </div>
</form>
